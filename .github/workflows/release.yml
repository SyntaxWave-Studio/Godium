name: Multi-platform Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            artifact: Godium-Linux
          - os: windows-latest
            platform: windows
            artifact: Godium-Windows.exe
          - os: macOS-latest
            platform: macos
            artifact: Godium-Mac

    steps:
      - uses: actions/checkout@v4

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev

      - if: matrix.platform == 'macos'
        run: |
          brew install qt6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt6)" >> $GITHUB_ENV

      - if: matrix.platform == 'windows'
        run: |
          vcpkg install qtbase:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
        shell: pwsh

      - run: cmake -S cmake -B build -DCMAKE_BUILD_TYPE=Release

      - run: cmake --build build --config Release --parallel

      - run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp build/Release/Godium.exe build/${{ matrix.artifact }}
          else
            cp build/Godium build/${{ matrix.artifact }}
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binary
          path: build/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - id: tag
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: release_assets/*
