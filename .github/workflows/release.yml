name: Multi-platform Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            archive_name: Godium-Linux.tar.gz
          - os: windows-latest
            platform: windows
            archive_name: Godium-Windows.zip
          - os: macos-latest
            platform: macos
            archive_name: Godium-Mac.zip

    steps:
      - uses: actions/checkout@v4

      - if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-qtbase-full-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: vcpkg-${{ runner.os }}-qtbase-full-

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev

      - if: matrix.platform == 'macos'
        run: |
          brew install qt6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt6)" >> $GITHUB_ENV

      - if: matrix.platform == 'windows'
        run: |
          vcpkg install qtbase:x64-windows --binarysource="clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
        shell: pwsh

      - if: matrix.platform == 'linux'
        run: cmake -S cmake -B build -DCMAKE_BUILD_TYPE=Release

      - if: matrix.platform == 'macos'
        run: cmake -S cmake -B build -DCMAKE_BUILD_TYPE=Release

      - if: matrix.platform == 'windows'
        run: cmake -S cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - run: cmake --build build --config Release --parallel

      - if: matrix.platform == 'linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p dist/usr/bin
          cp build/Godium dist/usr/bin/
          export QMAKE=/usr/lib/qt6/bin/qmake
          ./linuxdeploy-x86_64.AppImage --appdir dist --plugin qt
          tar -czvf build/${{ matrix.archive_name }} -C dist/usr .

      - if: matrix.platform == 'macos'
        run: |
          mkdir -p dist/Godium.app/Contents/MacOS dist/Godium.app/Contents/Resources
          if [ -f "build/Godium" ]; then
            cp build/Godium dist/Godium.app/Contents/MacOS/Godium
          elif [ -f "build/src/Godium" ]; then
            cp build/src/Godium dist/Godium.app/Contents/MacOS/Godium
          elif [ -d "build/Godium.app" ]; then
            rm -rf dist/Godium.app
            cp -r build/Godium.app dist/
          else
            echo "Error: No Godium binary found"
            exit 1
          fi
          "$(brew --prefix qt6)/bin/macdeployqt" dist/Godium.app -always-overwrite
          cd dist && zip -r ../build/${{ matrix.archive_name }} Godium.app
        shell: bash

      - if: matrix.platform == 'windows'
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build\Release\Godium.exe dist\
          $windeployqt = "C:\vcpkg\installed\x64-windows\tools\qt6\bin\windeployqt.exe"
          & $windeployqt --release --no-compiler-runtime dist\Godium.exe
          Compress-Archive -Path dist\* -DestinationPath build\${{ matrix.archive_name }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-archive
          path: build/${{ matrix.archive_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - id: tag
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: release_assets/*