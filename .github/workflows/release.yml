name: Multi-platform Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            archive_name: Godium-Linux.tar.gz
          - os: windows-latest
            platform: windows
            archive_name: Godium-Windows.zip
          - os: macos-latest
            platform: macos
            archive_name: Godium-Mac.zip

    steps:
      - uses: actions/checkout@v4

      - run: |
          cmake -S cmake -B build -DCMAKE_BUILD_TYPE=Release
        if: matrix.platform != 'windows'

      - run: |
          cmake -S cmake -B build -DCMAKE_BUILD_TYPE=Release
        if: matrix.platform == 'windows'

      - run: cmake --build build --config Release --parallel

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y patchelf
          mkdir -p dist
          cp build/Godium dist/
          for lib in $(ldd build/Godium | grep '=>' | awk '{print $3}'); do
            [ -f "$lib" ] && cp "$lib" dist/
          done
          for lib in dist/*.so*; do [ -f "$lib" ] && patchelf --set-rpath '$ORIGIN' "$lib"; done
          patchelf --set-rpath '$ORIGIN' dist/Godium
          tar -czvf build/${{ matrix.archive_name }} -C dist .

      - if: matrix.platform == 'macos'
        run: |
          mkdir -p dist/Godium.app/Contents/MacOS
          cp build/Godium dist/Godium.app/Contents/MacOS/ 2>/dev/null || cp build/src/Godium dist/Godium.app/Contents/MacOS/
          cd dist
          for lib in $(otool -L Godium.app/Contents/MacOS/Godium | grep '/usr/local\|/opt/homebrew\|@rpath' | awk '{print $1}'); do
            [ -f "$lib" ] && cp "$lib" Godium.app/Contents/MacOS/
          done
          zip -r ../build/${{ matrix.archive_name }} Godium.app
        shell: bash

      - if: matrix.platform == 'windows'
        run: |
          New-Item dist -Force
          Copy-Item build\Release\Godium.exe dist\ 2>$null; Copy-Item build\Godium.exe dist\ 2>$null
          Copy-Item build\*.dll dist\ 2>$null
          cd dist
          foreach ($file in Get-ChildItem *.dll) {
            $deps = & ldd $file.Name 2>$null | Select-String '=>' | ForEach-Object { $_.Line.Split('>')[-1].Trim().Split(' ')[0] }
            foreach ($dep in $deps) { if (Test-Path $dep) { Copy-Item $dep . -Force } }
          }
          cd ..
          Compress-Archive dist\* build\${{ matrix.archive_name }} -Force
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-archive
          path: build/${{ matrix.archive_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: release_assets/*